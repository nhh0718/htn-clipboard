<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipboard Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Header: search + filter toggle + settings -->
    <header>
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search clipboard..." autocomplete="off">
        <button id="filter-btn" class="icon-btn" title="Filters">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <button id="clear-btn" class="icon-btn hidden" title="Clear">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </header>

    <!-- Filter chips -->
    <div id="filters" class="filters hidden">
      <div class="chip-group">
        <button class="chip active" data-filter="type" data-value="">All</button>
        <button class="chip" data-filter="type" data-value="text">Text</button>
        <button class="chip" data-filter="type" data-value="image">Image</button>
      </div>
      <span class="chip-divider"></span>
      <div class="chip-group">
        <button class="chip active" data-filter="time" data-value="">Anytime</button>
        <button class="chip" data-filter="time" data-value="1h">1h</button>
        <button class="chip" data-filter="time" data-value="24h">24h</button>
        <button class="chip" data-filter="time" data-value="7d">7d</button>
        <button class="chip" data-filter="time" data-value="30d">30d</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="items-list"></div>

    <!-- Settings panel -->
    <div id="settings-panel" hidden>
      <label for="token-input">Auth Token</label>
      <div class="token-row">
        <input id="token-input" type="password" placeholder="Paste token from desktop app">
        <button id="toggle-token" class="icon-btn" title="Toggle visibility">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button id="save-token">Save Token</button>
      <p class="hint">Find token in Clipboard Pro &rarr; Settings</p>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
