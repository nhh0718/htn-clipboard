<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clipboard Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 400px;
  height: 600px;
  background: hsl(220 20% 10%);
  overflow: hidden;
  font-family: system-ui, sans-serif;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
}
#offline {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: hsl(215 15% 58%);
  font-size: 13px;
  gap: 12px;
  padding: 24px;
  text-align: center;
}
#offline.show { display: flex; }
#offline button {
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  background: hsl(221 83% 62%);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}
#offline button:hover { opacity: .9; }
</style>
</head>
<body>
  <iframe id="frame" src="http://127.0.0.1:27843"></iframe>
  <div id="offline">
    <p>Cannot connect to Clipboard Pro</p>
    <p style="font-size:11px;opacity:.7">Make sure the desktop app is running</p>
    <button id="retry-btn">Retry</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
