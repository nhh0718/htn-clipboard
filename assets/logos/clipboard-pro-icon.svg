<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#181b23"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="160" y1="120" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6aa6ff"/>
      <stop offset="100%" stop-color="#4f8ff7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="140" y1="200" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8edf5" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Back card (history layer 2) — offset right+down, faded -->
  <rect x="190" y="148" width="210" height="260" rx="18" fill="#2a3040" stroke="#3a4258" stroke-width="2"/>

  <!-- Middle card (history layer 1) — offset slightly -->
  <rect x="165" y="132" width="210" height="260" rx="18" fill="#323a50" stroke="#4a5270" stroke-width="2"/>

  <!-- Front clipboard board -->
  <rect x="136" y="116" width="210" height="280" rx="20" fill="url(#cardGrad)"/>

  <!-- Clipboard clip at top -->
  <rect x="200" y="92" width="82" height="48" rx="12" fill="url(#blueGrad)"/>
  <rect x="214" y="108" width="54" height="24" rx="8" fill="#181b23"/>

  <!-- Content lines on clipboard -->
  <rect x="168" y="176" width="120" height="10" rx="5" fill="url(#blueGrad)" opacity="0.85"/>
  <rect x="168" y="204" width="146" height="8" rx="4" fill="#b0bbd0" opacity="0.5"/>
  <rect x="168" y="226" width="130" height="8" rx="4" fill="#b0bbd0" opacity="0.4"/>
  <rect x="168" y="248" width="100" height="8" rx="4" fill="#b0bbd0" opacity="0.3"/>

  <!-- Copy/duplicate indicator — small overlapping squares bottom-right -->
  <g transform="translate(308, 310)">
    <rect x="0" y="12" width="52" height="52" rx="10" fill="none" stroke="url(#blueGrad)" stroke-width="4" opacity="0.6"/>
    <rect x="12" y="0" width="52" height="52" rx="10" fill="url(#blueGrad)" opacity="0.9"/>
    <path d="M28 18 v16 M20 26 h16" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
