<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c2540"/>
      <stop offset="100%" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="blue" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Back card — slightly offset, semi-transparent -->
  <rect x="168" y="118" width="220" height="290" rx="28" fill="#3b82f6" opacity="0.2" transform="rotate(4, 278, 263)"/>

  <!-- Front card — main, white, with shadow -->
  <rect x="124" y="100" width="220" height="290" rx="28" fill="#f8fafc" filter="url(#sh)"/>

  <!-- Clipboard clip — bold blue pill shape -->
  <rect x="186" y="72" width="96" height="56" rx="20" fill="url(#blue)" filter="url(#sh)"/>
  <rect x="206" y="90" width="56" height="24" rx="10" fill="#101828"/>

  <!-- Two bold content blocks (not thin lines — visible at small sizes) -->
  <rect x="158" y="184" width="140" height="18" rx="9" fill="url(#blue)"/>
  <rect x="158" y="222" width="110" height="14" rx="7" fill="#94a3b8" opacity="0.45"/>
  <rect x="158" y="250" width="152" height="14" rx="7" fill="#94a3b8" opacity="0.3"/>

  <!-- Divider -->
  <rect x="158" y="286" width="152" height="2" rx="1" fill="#94a3b8" opacity="0.15"/>

  <!-- Second block -->
  <rect x="158" y="306" width="100" height="14" rx="7" fill="#60a5fa" opacity="0.45"/>
  <rect x="158" y="332" width="130" height="12" rx="6" fill="#94a3b8" opacity="0.2"/>

  <!-- Copy badge — bottom right, large and clear -->
  <g transform="translate(310, 310)">
    <rect x="0" y="16" width="60" height="60" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <rect x="16" y="0" width="60" height="60" rx="16" fill="url(#blue)"/>
    <!-- Checkmark instead of plus — represents "copied" -->
    <path d="M30 22 L40 32 L54 18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
