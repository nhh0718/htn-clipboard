<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="160" y1="120" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6aa6ff"/>
      <stop offset="100%" stop-color="#4f8ff7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square — white -->
  <rect width="512" height="512" rx="108" fill="#ffffff"/>

  <!-- Back card (history layer 2) -->
  <rect x="190" y="148" width="210" height="260" rx="18" fill="#e8ecf2" stroke="#d0d6e0" stroke-width="2"/>

  <!-- Middle card (history layer 1) -->
  <rect x="165" y="132" width="210" height="260" rx="18" fill="#f0f2f7" stroke="#dde1ea" stroke-width="2"/>

  <!-- Front clipboard board -->
  <rect x="136" y="116" width="210" height="280" rx="20" fill="#ffffff" stroke="#c8d0dc" stroke-width="2"/>

  <!-- Clipboard clip -->
  <rect x="200" y="92" width="82" height="48" rx="12" fill="url(#blueGrad)"/>
  <rect x="214" y="108" width="54" height="24" rx="8" fill="#ffffff"/>

  <!-- Content lines -->
  <rect x="168" y="176" width="120" height="10" rx="5" fill="url(#blueGrad)" opacity="0.85"/>
  <rect x="168" y="204" width="146" height="8" rx="4" fill="#8090a8" opacity="0.4"/>
  <rect x="168" y="226" width="130" height="8" rx="4" fill="#8090a8" opacity="0.3"/>
  <rect x="168" y="248" width="100" height="8" rx="4" fill="#8090a8" opacity="0.2"/>

  <!-- Copy indicator -->
  <g transform="translate(308, 310)">
    <rect x="0" y="12" width="52" height="52" rx="10" fill="none" stroke="url(#blueGrad)" stroke-width="4" opacity="0.5"/>
    <rect x="12" y="0" width="52" height="52" rx="10" fill="url(#blueGrad)" opacity="0.9"/>
    <path d="M28 18 v16 M20 26 h16" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
