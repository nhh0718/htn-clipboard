<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2330"/>
      <stop offset="100%" stop-color="#181b23"/>
    </linearGradient>
    <linearGradient id="bl" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6aa6ff"/>
      <stop offset="100%" stop-color="#4f8ff7"/>
    </linearGradient>
  </defs>

  <!-- Icon: compact version -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#bg)"/>
  <!-- Back card -->
  <rect x="52" y="26" width="44" height="56" rx="5" fill="#2a3040" stroke="#3a4258" stroke-width="1"/>
  <!-- Middle card -->
  <rect x="44" y="22" width="44" height="56" rx="5" fill="#323a50" stroke="#4a5270" stroke-width="1"/>
  <!-- Front clipboard -->
  <rect x="34" y="18" width="44" height="62" rx="6" fill="#f0f2f8"/>
  <!-- Clip -->
  <rect x="47" y="12" width="18" height="12" rx="3" fill="url(#bl)"/>
  <rect x="50" y="16" width="12" height="6" rx="2" fill="#181b23"/>
  <!-- Lines -->
  <rect x="40" y="36" width="26" height="3" rx="1.5" fill="url(#bl)" opacity="0.8"/>
  <rect x="40" y="44" width="32" height="2" rx="1" fill="#8a96b0" opacity="0.4"/>
  <rect x="40" y="50" width="28" height="2" rx="1" fill="#8a96b0" opacity="0.3"/>
  <!-- Copy squares -->
  <g transform="translate(70, 62)">
    <rect x="0" y="4" width="14" height="14" rx="3" fill="none" stroke="url(#bl)" stroke-width="1.5" opacity="0.5"/>
    <rect x="4" y="0" width="14" height="14" rx="3" fill="url(#bl)" opacity="0.85"/>
    <path d="M8 4 v6 M5 7 h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Text: "Clipboard Pro" -->
  <text x="136" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#e8ecf4" letter-spacing="-0.5">
    Clipboard
  </text>
  <text x="136" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="300" fill="#4f8ff7" letter-spacing="-0.5">
    Pro
  </text>
</svg>
