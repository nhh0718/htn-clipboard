name: Screenshot Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - both

permissions:
  contents: read

jobs:
  screenshot-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS app
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Launch app, copy sample data, take screenshots
        run: |
          mkdir -p screenshots

          # Launch app
          open build/bin/clipboard-pro.app
          sleep 8

          # Screenshot 1: App just opened
          screencapture -x screenshots/01-app-opened.png

          # Copy sample data
          echo "Hello from Clipboard Pro!" | pbcopy
          sleep 2
          echo "SELECT * FROM users WHERE active = true;" | pbcopy
          sleep 2
          echo "https://github.com/nhh0718/htn-clipboard" | pbcopy
          sleep 2
          echo "Xin chao! Clipboard Pro da nen tang" | pbcopy
          sleep 2
          echo '{"name":"Clipboard Pro","version":"2.0.7"}' | pbcopy
          sleep 2
          echo "npm install && wails build -tags fts5" | pbcopy
          sleep 3

          # Screenshot 2: App with data
          screencapture -x screenshots/02-app-with-data.png

          # Open web dashboard
          open "http://localhost:27843"
          sleep 5
          screencapture -x screenshots/03-web-dashboard.png

          # Back to app
          osascript -e 'tell application "Clipboard Pro" to activate' 2>/dev/null || true
          sleep 2
          screencapture -x screenshots/04-app-final.png

          ls -lh screenshots/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 7

  screenshot-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build and screenshot
        shell: pwsh
        run: |
          wails build -tags fts5 -platform windows/amd64 -ldflags "-X main.version=test"
          New-Item -ItemType Directory -Force -Path screenshots

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Take-Screenshot($path) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          }

          Start-Process -FilePath "build\bin\clipboard-pro.exe"
          Start-Sleep -Seconds 8
          Take-Screenshot "screenshots\01-app-opened.png"

          "Hello from Clipboard Pro!" | Set-Clipboard
          Start-Sleep -Seconds 2
          "SELECT * FROM users;" | Set-Clipboard
          Start-Sleep -Seconds 2
          "https://github.com/nhh0718/htn-clipboard" | Set-Clipboard
          Start-Sleep -Seconds 3
          Take-Screenshot "screenshots\02-app-with-data.png"
        env:
          CGO_ENABLED: 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7
