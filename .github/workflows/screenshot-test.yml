name: Screenshot Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - both

permissions:
  contents: read

jobs:
  screenshot-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS app
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Grant macOS permissions
        run: |
          # Grant accessibility + screen recording permissions for screencapture
          # On CI runners, tccutil works without SIP
          sudo tccutil reset ScreenCapture 2>/dev/null || true
          sudo tccutil reset Accessibility 2>/dev/null || true

          # Add Terminal and screencapture to allowed apps
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for app in "/usr/sbin/screencapture" "/usr/bin/osascript" "/bin/bash"; do
            BUNDLE=$(osascript -e "id of app \"Terminal\"" 2>/dev/null || echo "com.apple.Terminal")
            sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceScreenCapture', '$BUNDLE', 0, 2, 0, 1);" 2>/dev/null || true
          done

          # Dismiss any pending permission dialogs via AppleScript
          osascript -e 'tell application "System Events" to click button "Allow" of window 1 of process "UserNotificationCenter"' 2>/dev/null || true
          osascript -e 'tell application "System Events" to click button "OK" of window 1 of process "UserNotificationCenter"' 2>/dev/null || true
          echo "Permissions configured"

      - name: Launch app and generate sample data
        run: |
          mkdir -p screenshots

          # Launch the app
          open build/bin/clipboard-pro.app
          echo "Waiting for app to start..."
          sleep 10

          # Auto-dismiss any macOS permission dialogs
          osascript <<'APPLESCRIPT'
            tell application "System Events"
              try
                repeat 3 times
                  click button "OK" of window 1 of process "UserNotificationCenter"
                  delay 0.5
                end repeat
              end try
              try
                click button "Allow" of window 1 of process "UserNotificationCenter"
              end try
              try
                click button "Open System Settings" of window 1 of process "UserNotificationCenter"
              end try
            end tell
          APPLESCRIPT
          sleep 2

          # Copy sample data to clipboard via pbcopy
          echo "Hello from Clipboard Pro! This is a sample text entry." | pbcopy
          sleep 2
          echo "SELECT * FROM users WHERE active = true ORDER BY created_at DESC;" | pbcopy
          sleep 2
          echo "https://github.com/nhh0718/htn-clipboard" | pbcopy
          sleep 2
          echo "Xin chao! Day la Clipboard Pro — ung dung quan ly clipboard da nen tang" | pbcopy
          sleep 2
          echo '{"name": "Clipboard Pro", "version": "2.0.7", "platform": ["Windows", "macOS"]}' | pbcopy
          sleep 2
          echo "npm install && wails build -tags fts5" | pbcopy
          sleep 3

          echo "6 sample items copied"

      - name: Screenshot app
        run: |
          # Activate the app window
          osascript -e 'tell application "Clipboard Pro" to activate' 2>/dev/null || true
          sleep 2

          # Take screenshot (screencapture -x = no sound)
          screencapture -x screenshots/01-app-with-data.png
          echo "Captured: app with clipboard data"

      - name: Screenshot web dashboard
        run: |
          # Open dashboard in default browser
          open "http://localhost:27843"
          sleep 5

          # Focus Safari/browser
          osascript -e 'tell application "Safari" to activate' 2>/dev/null || true
          sleep 2

          screencapture -x screenshots/02-web-dashboard.png
          echo "Captured: web dashboard"

      - name: Screenshot app again (switch back)
        run: |
          # Focus app again
          osascript -e 'tell application "Clipboard Pro" to activate' 2>/dev/null || true
          sleep 2

          screencapture -x screenshots/03-app-final.png
          echo "Captured: app final state"

          # List all screenshots
          echo "=== All Screenshots ==="
          ls -lh screenshots/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 7

  screenshot-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows app
        run: wails build -tags fts5 -platform windows/amd64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Launch app, generate data, take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots

          # Screenshot helper
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Take-Screenshot($path) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            Write-Output "Captured: $path"
          }

          # Launch app
          Start-Process -FilePath "build\bin\clipboard-pro.exe"
          Start-Sleep -Seconds 8

          # Copy sample data
          "Hello from Clipboard Pro! Sample text entry." | Set-Clipboard
          Start-Sleep -Seconds 2
          "SELECT * FROM users WHERE active = true;" | Set-Clipboard
          Start-Sleep -Seconds 2
          "https://github.com/nhh0718/htn-clipboard" | Set-Clipboard
          Start-Sleep -Seconds 2
          '{"name": "Clipboard Pro", "version": "2.0.7"}' | Set-Clipboard
          Start-Sleep -Seconds 3

          Take-Screenshot "screenshots\01-app-with-data.png"

          # Open web dashboard
          Start-Process "http://localhost:27843"
          Start-Sleep -Seconds 5
          Take-Screenshot "screenshots\02-web-dashboard.png"

          Get-ChildItem screenshots\

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7
