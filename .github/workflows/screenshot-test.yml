name: Screenshot Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - both

permissions:
  contents: read

jobs:
  screenshot-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS app
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Launch app and generate sample data
        run: |
          mkdir -p screenshots

          # Launch the app in background
          open build/bin/clipboard-pro.app &
          echo "Waiting for app to start..."
          sleep 8

          # Copy sample data to clipboard so the app captures it
          echo "Hello from Clipboard Pro! 🚀 This is a sample text entry." | pbcopy
          sleep 2
          echo "SELECT * FROM users WHERE active = true ORDER BY created_at DESC;" | pbcopy
          sleep 2
          echo "https://github.com/nhh0718/htn-clipboard — Clipboard Pro repository" | pbcopy
          sleep 2
          echo "Xin chào! Đây là Clipboard Pro — ứng dụng quản lý clipboard đa nền tảng 🇻🇳" | pbcopy
          sleep 2
          echo '{"name": "Clipboard Pro", "version": "2.0.6", "platform": ["Windows", "macOS"]}' | pbcopy
          sleep 2
          echo "npm install && wails build -tags fts5 -platform darwin/arm64" | pbcopy
          sleep 2

          echo "Sample data copied to clipboard"

      - name: Screenshot app with data
        run: |
          # Screenshot 1: App with clipboard history
          screencapture -x screenshots/01-app-with-data.png
          echo "Captured app with data"
          sleep 1

          # Screenshot 2: Full desktop view
          screencapture -x screenshots/02-full-desktop.png
          echo "Captured full desktop"

      - name: Open web dashboard and screenshot
        run: |
          # Open dashboard in Safari
          open "http://localhost:27843"
          echo "Waiting for dashboard to load..."
          sleep 5

          # Screenshot 3: Web dashboard
          screencapture -x screenshots/03-web-dashboard.png
          echo "Captured web dashboard"
          sleep 2

          # Click on the Safari window to make sure it's focused
          osascript -e 'tell application "Safari" to activate' 2>/dev/null || true
          sleep 2
          screencapture -x screenshots/04-web-dashboard-focused.png
          echo "Captured web dashboard focused"

      - name: Screenshot analytics tab
        run: |
          # Switch back to app and try clicking analytics tab
          osascript -e 'tell application "clipboard-pro" to activate' 2>/dev/null || true
          sleep 2
          screencapture -x screenshots/05-app-focused.png
          echo "Captured app focused"

          echo "All screenshots captured!"
          ls -la screenshots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 7

  screenshot-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows app
        run: wails build -tags fts5 -platform windows/amd64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Launch app and take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots

          # Launch app in background
          Start-Process -FilePath "build\bin\clipboard-pro.exe"
          Write-Output "Waiting for app to start..."
          Start-Sleep -Seconds 8

          # Take screenshots using PowerShell
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          function Take-Screenshot($path) {
            $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bitmap.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
            Write-Output "Captured: $path"
          }

          Take-Screenshot "screenshots\01-main-window.png"
          Start-Sleep -Seconds 3
          Take-Screenshot "screenshots\02-after-load.png"

          Write-Output "All screenshots captured!"
          Get-ChildItem screenshots\

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7
