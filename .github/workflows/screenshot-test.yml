name: Screenshot Test

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test"
        required: true
        default: "macos"
        type: choice
        options:
          - macos
          - windows
          - both

permissions:
  contents: read

jobs:
  screenshot-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build macOS app
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Launch app and generate sample data
        run: |
          mkdir -p screenshots

          # Launch the app
          open build/bin/clipboard-pro.app
          echo "Waiting for app to start..."
          sleep 10

          # Copy sample data via pbcopy
          echo "Hello from Clipboard Pro! This is a sample text entry." | pbcopy
          sleep 2
          echo "SELECT * FROM users WHERE active = true ORDER BY created_at DESC;" | pbcopy
          sleep 2
          echo "https://github.com/nhh0718/htn-clipboard" | pbcopy
          sleep 2
          echo "Xin chao! Day la Clipboard Pro — ung dung quan ly clipboard da nen tang" | pbcopy
          sleep 2
          echo '{"name": "Clipboard Pro", "version": "2.0.7", "platform": ["Windows", "macOS"]}' | pbcopy
          sleep 2
          echo "npm install && wails build -tags fts5" | pbcopy
          sleep 3

          echo "6 sample items copied, app should have captured them"

      - name: Screenshot web dashboard via Playwright
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 420, height: 700 } });

            // Main dashboard (no auth needed for same-origin, but we need token)
            // First get the auth token from the API
            let token = '';
            try {
              const resp = await page.request.get('http://localhost:27843/api/v1/ping');
              console.log('Ping:', resp.status());
            } catch(e) {
              console.log('Ping failed:', e.message);
            }

            // Screenshot 1: Dashboard login/token page
            await page.goto('http://localhost:27843');
            await page.waitForTimeout(3000);
            await page.screenshot({ path: 'screenshots/01-web-dashboard-login.png', fullPage: true });
            console.log('Captured: web dashboard login');

            // Screenshot 2: Try with a wide viewport (like desktop)
            await page.setViewportSize({ width: 1200, height: 800 });
            await page.goto('http://localhost:27843');
            await page.waitForTimeout(3000);
            await page.screenshot({ path: 'screenshots/02-web-dashboard-wide.png', fullPage: true });
            console.log('Captured: web dashboard wide');

            // Screenshot 3: Mobile viewport
            await page.setViewportSize({ width: 375, height: 812 });
            await page.goto('http://localhost:27843');
            await page.waitForTimeout(2000);
            await page.screenshot({ path: 'screenshots/03-web-mobile.png', fullPage: true });
            console.log('Captured: web mobile');

            await browser.close();
            console.log('All Playwright screenshots done');
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          retention-days: 7

  screenshot-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Build Windows app
        run: wails build -tags fts5 -platform windows/amd64 -ldflags "-X main.version=test"
        env:
          CGO_ENABLED: 1

      - name: Launch app, generate data, take screenshots
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path screenshots

          # Launch app
          Start-Process -FilePath "build\bin\clipboard-pro.exe"
          Start-Sleep -Seconds 10

          # Copy sample data
          "Hello from Clipboard Pro! Sample text entry." | Set-Clipboard
          Start-Sleep -Seconds 2
          "SELECT * FROM users WHERE active = true;" | Set-Clipboard
          Start-Sleep -Seconds 2
          "https://github.com/nhh0718/htn-clipboard" | Set-Clipboard
          Start-Sleep -Seconds 2
          '{"name": "Clipboard Pro", "version": "2.0.7"}' | Set-Clipboard
          Start-Sleep -Seconds 3

          # Take native screenshot
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("screenshots\01-windows-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          Write-Output "Captured: Windows app"

      - name: Screenshot web dashboard via Playwright
        shell: pwsh
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 420, height: 700 } });
            await page.goto('http://localhost:27843');
            await page.waitForTimeout(3000);
            await page.screenshot({ path: 'screenshots/02-web-dashboard.png', fullPage: true });
            console.log('Captured: web dashboard');

            await page.setViewportSize({ width: 1200, height: 800 });
            await page.goto('http://localhost:27843');
            await page.waitForTimeout(3000);
            await page.screenshot({ path: 'screenshots/03-web-dashboard-wide.png', fullPage: true });
            console.log('Captured: web dashboard wide');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          retention-days: 7
