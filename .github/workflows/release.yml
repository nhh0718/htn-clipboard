name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows
        run: wails build -platform windows/amd64
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-windows
          path: build/bin/clipboard-pro.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS (arm64)
        run: wails build -platform darwin/arm64
        env:
          CGO_ENABLED: 1

      - name: Package macOS app
        run: |
          cd build/bin
          zip -r clipboard-pro-macos-arm64.zip clipboard-pro.app

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-macos
          path: build/bin/clipboard-pro-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux
        run: wails build -platform linux/amd64
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-linux
          path: build/bin/clipboard-pro

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Package Chrome Extension
        run: |
          cd extension/dist
          zip -r ../../clipboard-pro-chrome-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clipboard-pro-windows/clipboard-pro.exe
            clipboard-pro-macos/clipboard-pro-macos-arm64.zip
            clipboard-pro-linux/clipboard-pro
            clipboard-pro-chrome-extension.zip
