name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-windows-${{ hashFiles('go.sum') }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          winget install NSIS.NSIS --accept-source-agreements --accept-package-agreements --silent
          $candidates = @(
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS",
            "${env:LOCALAPPDATA}\Programs\NSIS"
          )
          foreach ($p in $candidates) {
            if (Test-Path "$p\makensis.exe") {
              echo $p >> $env:GITHUB_PATH
              Write-Output "NSIS found at: $p"
              exit 0
            }
          }
          $found = Get-ChildItem "C:\Program Files*" -Recurse -Filter "makensis.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            echo $found.DirectoryName >> $env:GITHUB_PATH
            exit 0
          }
          Write-Error "NSIS not found"
          exit 1

      - name: Build Windows (exe + installer)
        run: wails build -tags fts5 -platform windows/amd64 -nsis -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-windows
          path: |
            build/bin/clipboard-pro.exe
            build/bin/clipboard-pro-amd64-installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-macos-${{ hashFiles('go.sum') }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS (arm64)
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - name: Package macOS app
        run: |
          cd build/bin
          zip -r clipboard-pro-macos-arm64.zip clipboard-pro.app

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-macos
          path: build/bin/clipboard-pro-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails*
          key: wails-linux-${{ hashFiles('go.sum') }}

      - name: Install Wails
        if: steps.cache-wails.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux
        run: wails build -tags fts5 -platform linux/amd64 -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-linux
          path: build/bin/clipboard-pro

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Package Chrome Extension
        run: |
          cd extension/dist
          zip -r ../../clipboard-pro-chrome-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clipboard-pro-windows/clipboard-pro.exe
            clipboard-pro-windows/clipboard-pro-amd64-installer.exe
            clipboard-pro-macos/clipboard-pro-macos-arm64.zip
            clipboard-pro-linux/clipboard-pro
            clipboard-pro-chrome-extension.zip
