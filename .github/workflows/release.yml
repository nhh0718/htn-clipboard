name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          # Download NSIS portable zip directly (no choco dependency)
          $nsisVer = "3.10"
          $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/$nsisVer/nsis-$nsisVer.zip/download"
          $zip = "$env:TEMP\nsis.zip"
          Write-Output "Downloading NSIS $nsisVer..."
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $wc = New-Object System.Net.WebClient
          $wc.DownloadFile($url, $zip)
          Write-Output "Extracting..."
          Expand-Archive -Path $zip -DestinationPath "C:\nsis-extract" -Force
          $nsisDir = "C:\nsis-extract\nsis-$nsisVer"
          if (Test-Path "$nsisDir\makensis.exe") {
            echo $nsisDir >> $env:GITHUB_PATH
            Write-Output "NSIS ready at $nsisDir"
          } else {
            # Might be extracted without version subfolder
            $found = Get-ChildItem "C:\nsis-extract" -Recurse -Filter "makensis.exe" | Select-Object -First 1
            echo $found.DirectoryName >> $env:GITHUB_PATH
            Write-Output "NSIS ready at $($found.DirectoryName)"
          }

      - name: Build Windows (exe + installer)
        run: wails build -tags fts5 -platform windows/amd64 -nsis -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-windows
          path: |
            build/bin/clipboard-pro.exe
            build/bin/clipboard-pro-amd64-installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS (arm64)
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - name: Package macOS app
        run: |
          cd build/bin
          zip -r clipboard-pro-macos-arm64.zip clipboard-pro.app

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-macos
          path: build/bin/clipboard-pro-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux
        run: wails build -tags fts5 -platform linux/amd64 -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-linux
          path: build/bin/clipboard-pro

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Package Chrome Extension
        run: |
          cd extension/dist
          zip -r ../../clipboard-pro-chrome-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clipboard-pro-windows/clipboard-pro.exe
            clipboard-pro-windows/clipboard-pro-amd64-installer.exe
            clipboard-pro-macos/clipboard-pro-macos-arm64.zip
            clipboard-pro-linux/clipboard-pro
            clipboard-pro-chrome-extension.zip
