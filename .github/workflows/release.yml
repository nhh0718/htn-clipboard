name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        shell: pwsh
        run: |
          # Try choco first, fallback to direct download if it fails
          $nsisInstalled = $false
          try {
            choco install nsis -y --no-progress 2>$null
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
              Write-Output "NSIS installed via choco"
              $nsisInstalled = $true
            }
          } catch {}
          if (-not $nsisInstalled) {
            Write-Output "Choco failed, downloading NSIS directly..."
            $url = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe/download"
            $installer = "$env:TEMP\nsis-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            Start-Process -Wait -FilePath $installer -ArgumentList "/S","/D=C:\nsis"
            echo "C:\nsis" >> $env:GITHUB_PATH
            Write-Output "NSIS installed via direct download to C:\nsis"
          }
          # Verify
          $env:PATH = "C:\Program Files (x86)\NSIS;C:\nsis;$env:PATH"
          makensis /VERSION

      - name: Build Windows (exe + installer)
        run: wails build -tags fts5 -platform windows/amd64 -nsis -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-windows
          path: |
            build/bin/clipboard-pro.exe
            build/bin/clipboard-pro-amd64-installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build macOS (arm64)
        run: wails build -tags fts5 -platform darwin/arm64 -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - name: Package macOS app
        run: |
          cd build/bin
          zip -r clipboard-pro-macos-arm64.zip clipboard-pro.app

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-macos
          path: build/bin/clipboard-pro-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux
        run: wails build -tags fts5 -platform linux/amd64 -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          CGO_ENABLED: 1

      - uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-linux
          path: build/bin/clipboard-pro

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Package Chrome Extension
        run: |
          cd extension/dist
          zip -r ../../clipboard-pro-chrome-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            clipboard-pro-windows/clipboard-pro.exe
            clipboard-pro-windows/clipboard-pro-amd64-installer.exe
            clipboard-pro-macos/clipboard-pro-macos-arm64.zip
            clipboard-pro-linux/clipboard-pro
            clipboard-pro-chrome-extension.zip
