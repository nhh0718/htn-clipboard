name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install GCC (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build desktop app
        env:
          CGO_ENABLED: '1'
        run: wails build -tags fts5 -platform ${{ runner.os == 'Windows' && 'windows/amd64' || 'darwin/amd64' }}

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-windows
          path: build/bin/clipboard-pro.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-macos
          path: build/bin/

  build-extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Package extension zip
        working-directory: extension
        run: zip -r clipboard-pro-extension.zip dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipboard-pro-extension
          path: extension/clipboard-pro-extension.zip

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          gh release create "$VERSION" \
            --title "Clipboard Pro $VERSION" \
            --generate-notes \
            artifacts/clipboard-pro-windows/clipboard-pro.exe#clipboard-pro-windows-amd64.exe \
            artifacts/clipboard-pro-extension/clipboard-pro-extension.zip#clipboard-pro-extension-${VERSION}.zip
